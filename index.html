<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study with Cat Mimi!!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* ── THEME TOKENS ── */
:root {
  --bg:        #f2c4ce;
  --card:      #7a6d9e;
  --card-soft: rgba(122,109,158,.55);
  --title:     #3a2a4a;
  --np-bg:     #ffffff;
  --np-border: #c9a8c5;
  --np-text:   #7a5c8a;
  --note-bg:   #ffffff;
  --note-text: #3a2a4a;
  --note-item: #f9f0ff;
  --tile-border:rgba(255,255,255,.18);
  --modal-bg:  rgba(60,40,80,.5);
  --dark-btn:  #2a1a3a;
  --active-mode:#f2c4ce;
  --active-mode-text:#7a3060;
  --start-text:#5a3070;
  --start-run: #f2c4ce;
  --start-run-text:#7a1040;
  --shadow:    rgba(80,60,110,.22);
}
[data-theme="dark"] {
  --bg:        #1a1428;
  --card:      #2d2545;
  --card-soft: rgba(45,37,69,.8);
  --title:     #f0d6ff;
  --np-bg:     #2d2545;
  --np-border: #6a4a8a;
  --np-text:   #c9a8e0;
  --note-bg:   #1e1830;
  --note-text: #e8d6ff;
  --note-item: #2d2545;
  --tile-border:rgba(255,255,255,.1);
  --modal-bg:  rgba(10,6,22,.7);
  --dark-btn:  #e0c8ff;
  --active-mode:#6a3a8a;
  --active-mode-text:#f0d6ff;
  --start-text:#c9a8e0;
  --start-run: #6a3a8a;
  --start-run-text:#f0d6ff;
  --shadow:    rgba(0,0,0,.45);
}

html, body {
  width:100%; height:100%;
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  overflow-x:hidden;
  transition:background .35s;
}
body {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:0;
}

/* ── DARK MODE TOGGLE ── */
.theme-btn {
  position:fixed; bottom:20px; right:20px;
  width:46px; height:46px; border-radius:50%;
  border:none; cursor:pointer;
  background:var(--card);
  font-size:20px;
  box-shadow:0 4px 16px var(--shadow);
  z-index:300;
  transition:transform .2s, background .35s;
  display:flex; align-items:center; justify-content:center;
}
.theme-btn:hover { transform:scale(1.12) rotate(15deg); }

/* ── HEADER ── */
.header {
  width:100%;
  padding:16px 32px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  flex-shrink:0;
  gap:10px;
}

.music-area { display:flex; align-items:center; gap:8px; z-index:2; flex-shrink:0; }

.headphone-btn {
  background:none; border:none; cursor:pointer;
  font-size:36px; line-height:1;
  transition:transform .2s;
  filter:hue-rotate(220deg) saturate(0.7);
  flex-shrink:0;
}
.headphone-btn:hover { transform:scale(1.15) rotate(-8deg); }

.now-playing {
  background:var(--np-bg);
  border:2.5px solid var(--np-border);
  border-radius:20px;
  padding:5px 14px;
  font-size:12px; font-weight:700; color:var(--np-text);
  min-width:140px; max-width:200px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  height:34px; display:flex; align-items:center;
  transition:background .35s, border-color .35s, color .35s;
}
.now-playing.idle { font-style:italic; font-weight:600; opacity:.7; }

.site-title {
  position:absolute; left:50%; transform:translateX(-50%);
  font-family:'Fredoka One',cursive;
  font-size:clamp(24px,3.5vw,50px);
  color:var(--title);
  white-space:nowrap;
  letter-spacing:.5px;
  transition:color .35s;
  pointer-events:none;
}

/* ── PIXEL CAT ── */
.cat-wrap {
  width:110px; height:124px;
  flex-shrink:0; z-index:2; cursor:pointer;
  animation:catBob 2.6s ease-in-out infinite;
}
@keyframes catBob {
  0%,100%{ transform:translateY(0); }
  40%    { transform:translateY(-8px); }
  70%    { transform:translateY(3px); }
}
@keyframes catWiggle {
  0%,100%{ transform:rotate(0) scale(1); }
  25%    { transform:rotate(-12deg) scale(1.08); }
  75%    { transform:rotate(12deg) scale(1.08); }
}

/* ── CONTENT WRAP ── */
.content-wrap {
  flex:1;
  display:flex;
  flex-direction:column;
  padding:0 32px 28px;
}

/* ── PURPLE CARD ── */
.main-card {
  background:var(--card);
  border-radius:24px;
  width:100%;
  padding:24px 32px 28px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 40px var(--shadow);
  flex-shrink:0;
  transition:background .35s;
}

.stars-canvas { position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:24px; }
.star {
  position:absolute; font-size:12px; opacity:.75;
  animation:twinkle var(--d,2.5s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes twinkle {
  0%,100%{ opacity:.8; transform:scale(1); }
  50%    { opacity:.2; transform:scale(.5); }
}

.deco { position:absolute; pointer-events:none; }
.deco-star-r { right:56px; bottom:80px; font-size:28px; animation:starFloat 4s ease-in-out infinite; }
.deco-spark1 { left:100px; bottom:40px; font-size:20px; color:#fff; animation:sparkA 3.5s ease-in-out infinite; animation-delay:.8s; }
.deco-spark2 { right:80px; bottom:42px; font-size:26px; color:#fff; animation:sparkA 2.8s ease-in-out infinite; animation-delay:1.4s; }
.deco-spark3 { right:180px; top:18px; font-size:16px; color:#fff; animation:sparkA 3s ease-in-out infinite; animation-delay:.3s; }
@keyframes starFloat { 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-10px) rotate(18deg); } }
@keyframes sparkA { 0%,100%{ opacity:1; transform:scale(1) rotate(0); } 50%{ opacity:.25; transform:scale(.6) rotate(25deg); } }

/* ── MODES ROW ── */
.modes-row {
  display:flex; align-items:center; gap:10px;
  margin-bottom:20px;
  position:relative; z-index:2;
  flex-wrap:wrap;
}

.clock-icon {
  font-size:52px; line-height:1;
  animation:clockTick 1s steps(1) infinite;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));
  flex-shrink:0;
}
@keyframes clockTick { 0%,49%{ transform:rotate(-5deg); } 50%,100%{ transform:rotate(5deg); } }
.clock-icon.running { animation:clockSpin 2s linear infinite; }
@keyframes clockSpin { from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

.mode-btn {
  background:white; border:none; border-radius:50px;
  padding:10px 22px;
  font-family:'Fredoka One',cursive;
  font-size:15px; color:#5a4570;
  cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;
  box-shadow:0 3px 0 rgba(0,0,0,.12);
}
.mode-btn:hover { transform:translateY(-2px); box-shadow:0 5px 0 rgba(0,0,0,.14); }
.mode-btn.active { background:var(--active-mode); color:var(--active-mode-text); }

.add-note-btn {
  margin-left:auto;
  background:white; border:3px solid var(--dark-btn);
  border-radius:12px; padding:10px 22px;
  font-family:'Fredoka One',cursive;
  font-size:15px; color:var(--dark-btn);
  cursor:pointer;
  box-shadow:3px 3px 0 var(--dark-btn);
  transition:transform .15s,box-shadow .15s,background .18s,color .35s,border-color .35s;
}
.add-note-btn:hover { background:#f9eaff; transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--dark-btn); }
.add-note-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--dark-btn); }

/* ── TIMER BOX ── */
.timer-box {
  background:rgba(255,255,255,.15);
  border-radius:18px; min-height:200px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  position:relative; z-index:2;
  margin-bottom:22px;
  border:1.5px solid rgba(255,255,255,.22);
}
.timer-display {
  font-family:'Fredoka One',cursive;
  font-size:clamp(68px,9vw,108px);
  color:white; letter-spacing:6px;
  text-shadow:0 4px 24px rgba(0,0,0,.22);
}
.timer-display.pulse { animation:bigPulse .6s ease-out; }
@keyframes bigPulse { 0%{ transform:scale(1); } 40%{ transform:scale(1.07); } 100%{ transform:scale(1); } }

.session-label {
  font-size:13px; font-weight:800;
  color:rgba(255,255,255,.7);
  margin-top:8px; letter-spacing:2px; text-transform:uppercase;
}

/* ── START BUTTON ── */
.start-btn {
  display:block; margin:0 auto;
  background:white; border:none; border-radius:50px;
  padding:16px 90px;
  font-family:'Fredoka One',cursive;
  font-size:22px; color:var(--start-text);
  cursor:pointer; position:relative; z-index:2;
  box-shadow:0 5px 0 rgba(0,0,0,.16);
  transition:transform .15s,box-shadow .15s,background .2s,color .2s;
  letter-spacing:2px;
}
.start-btn:hover { transform:translateY(-3px); box-shadow:0 8px 0 rgba(0,0,0,.16); }
.start-btn:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.16); }
.start-btn.running { background:var(--start-run); color:var(--start-run-text); }

/* ── BOTTOM TILES ── */
.bottom-row {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
  margin-top:20px;
  flex-shrink:0;
}
.info-tile {
  background:var(--card-soft);
  border-radius:18px; padding:18px 20px;
  border:1.5px solid var(--tile-border);
  position:relative; overflow:hidden;
  transition:background .35s;
}
.info-tile h4 {
  font-family:'Fredoka One',cursive;
  font-size:15px; color:rgba(255,255,255,.88);
  letter-spacing:.5px; margin-bottom:10px;
}
.counter-nums { display:flex; gap:14px; align-items:flex-end; }
.counter-big { font-family:'Fredoka One',cursive; font-size:46px; color:white; line-height:1; }
.counter-label { font-size:13px; font-weight:700; color:rgba(255,255,255,.6); padding-bottom:5px; }
.tip-text { font-size:13px; font-weight:600; color:rgba(255,255,255,.8); line-height:1.6; }
.tip-emoji { font-size:20px; margin-bottom:6px; display:block; }
.goal-bar-bg { background:rgba(255,255,255,.2); border-radius:8px; height:10px; margin:6px 0 4px; }
.goal-bar-fill { background:#f2c4ce; border-radius:8px; height:10px; width:0%; transition:width .5s ease; }
.goal-meta { display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:rgba(255,255,255,.65); margin-top:4px; }
.goal-btns { display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
.goal-btn {
  background:rgba(255,255,255,.18); border:1.5px solid rgba(255,255,255,.3);
  border-radius:30px; padding:5px 13px;
  font-family:'Fredoka One',cursive; font-size:13px; color:white;
  cursor:pointer; transition:background .2s;
}
.goal-btn:hover { background:rgba(255,255,255,.32); }
.goal-btn.active-goal { background:#f2c4ce; color:#7a3060; border-color:#f2c4ce; }

/* ── NOTE MODAL ── */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:var(--modal-bg);
  z-index:200; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.note-modal {
  background:var(--note-bg); border-radius:20px;
  width:min(500px,92vw); padding:24px;
  box-shadow:0 16px 56px var(--shadow);
  animation:popIn .25s cubic-bezier(.34,1.56,.64,1);
  transition:background .35s;
}
@keyframes popIn { from{ transform:scale(.8); opacity:0; } to{ transform:scale(1); opacity:1; } }
.note-modal h3 { font-family:'Fredoka One',cursive; color:#9a72b8; font-size:20px; margin-bottom:12px; }
.note-textarea {
  width:100%; min-height:140px;
  border:2px solid var(--np-border); border-radius:12px;
  padding:12px; font-family:'Nunito',sans-serif;
  font-size:14px; color:var(--note-text);
  background:var(--note-bg);
  resize:vertical; outline:none;
  transition:border-color .2s, background .35s, color .35s;
}
.note-textarea:focus { border-color:#9a72b8; }
.note-actions { display:flex; gap:10px; margin-top:12px; justify-content:flex-end; }
.note-save,.note-close {
  padding:9px 22px; border-radius:50px; border:none;
  font-family:'Fredoka One',cursive; font-size:14px; cursor:pointer; transition:transform .15s;
}
.note-save { background:#9a72b8; color:white; }
.note-save:hover { transform:scale(1.04); }
.note-close { background:#f0e8f8; color:#5a3070; }
.note-close:hover { transform:scale(1.04); }
.saved-notes { margin-top:12px; max-height:150px; overflow-y:auto; }
.note-item {
  background:var(--note-item); border-radius:10px;
  padding:8px 12px; margin-bottom:8px;
  font-size:13px; color:var(--note-text); position:relative;
  border-left:3px solid #b88ad4;
  transition:background .35s, color .35s;
}
.note-delete { position:absolute; right:8px; top:6px; background:none; border:none; cursor:pointer; color:#c090d8; font-size:16px; }

/* ═══════════════════════════════════════
   MOBILE  ≤ 640px
═══════════════════════════════════════ */
@media (max-width:640px) {

  .header {
    padding:12px 16px 8px;
    flex-wrap:nowrap;
    gap:6px;
  }

  /* hide now-playing label on tiny screens, just keep headphone */
  .now-playing { display:none; }

  .site-title {
    position:static;
    transform:none;
    font-size:clamp(18px,5.5vw,26px);
    text-align:center;
    flex:1;
    pointer-events:auto;
  }

  .cat-wrap { width:72px; height:82px; }

  .content-wrap { padding:0 14px 20px; }

  .main-card { padding:16px 16px 20px; border-radius:18px; }

  /* stack clock + mode buttons in 2 rows */
  .modes-row {
    gap:8px;
    margin-bottom:14px;
  }
  .clock-icon { font-size:38px; }
  .mode-btn { padding:8px 14px; font-size:13px; }
  .add-note-btn {
    padding:8px 14px; font-size:13px;
    margin-left:0; width:100%;
    text-align:center;
    box-shadow:2px 2px 0 var(--dark-btn);
  }

  /* separate add-note to its own row */
  .modes-row { flex-wrap:wrap; }
  .add-note-btn { order:10; }

  .timer-box { min-height:150px; margin-bottom:16px; }
  .timer-display { font-size:clamp(58px,16vw,80px); letter-spacing:4px; }
  .session-label { font-size:11px; letter-spacing:1.5px; }

  .start-btn { padding:14px 0; width:80%; font-size:19px; letter-spacing:1px; }

  /* stack tiles vertically on mobile */
  .bottom-row {
    grid-template-columns:1fr;
    gap:12px;
    margin-top:14px;
  }
  .info-tile { padding:14px 16px; }
  .counter-big { font-size:38px; }

  .theme-btn { bottom:14px; right:14px; width:40px; height:40px; font-size:17px; }

  /* deco sparkles hidden on small screens (clutter) */
  .deco { display:none; }
}

/* ═══════════════════════════════════════
   TABLET  641–900px
═══════════════════════════════════════ */
@media (min-width:641px) and (max-width:900px) {
  .header { padding:14px 22px 8px; }
  .content-wrap { padding:0 22px 24px; }
  .now-playing { min-width:120px; max-width:150px; font-size:11px; }
  .site-title { font-size:clamp(22px,3.5vw,36px); }
  .cat-wrap { width:88px; height:100px; }
  .bottom-row { grid-template-columns:1fr 1fr; }
  .bottom-row .info-tile:last-child { grid-column:1/-1; }
}
</style>
</head>
<body>

<!-- DARK MODE TOGGLE -->

<!-- HEADER -->

  <h1 class="site-title">Study with Cat Mimi!!</h1>

  <!-- Pixel Cat -->

      <rect x="18" y="7"  width="1" height="1" fill="#fff"/>

      <rect x="25" y="13" width="4" height="1" fill="#2a2a2a"/>

</div>

<!-- MAIN CONTENT -->
<div class="content-wrap">

  <!-- PURPLE CARD -->
  <div class="main-card">
    <div class="stars-canvas" id="starsBg"></div>
    <span class="deco deco-star-r">⭐</span>

  <!-- BOTTOM TILES -->
  <div class="bottom-row">
    <div class="info-tile">
      <h4>🍅 Today's Sessions</h4>
      <div class="counter-nums">
        <div class="counter-big" id="sessionCount">0</div>
        <div class="counter-label">completed</div>

        Keep going, Mimi believes in you! 🐱
      </div>
    </div>

    <div class="info-tile">
      <h4>🎯 Daily Goal</h4>
      <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.6);margin-bottom:2px;">Target sessions:</div>
      <div class="goal-btns">
        <button class="goal-btn active-goal" data-goal="4"  onclick="setGoal(this)">4</button>
        <button class="goal-btn" data-goal="6"  onclick="setGoal(this)">6</button>
        <button class="goal-btn" data-goal="8"  onclick="setGoal(this)">8</button>
        <button class="goal-btn" data-goal="10" onclick="setGoal(this)">10</button>
      </div>
      <div class="goal-bar-bg"><div class="goal-bar-fill" id="goalBar"></div></div>
      <div class="goal-meta">
        <span id="goalDone">0 done</span>
        <span id="goalTotal">/ 4 goal</span>
      </div>
    </div>

    <div class="info-tile">
      <h4>💡 Mimi's Tip</h4>
      <span class="tip-emoji" id="tipEmoji">🌸</span>
      <div class="tip-text" id="tipText">Take a deep breath before you start. A calm mind studies better!</div>
      <button class="goal-btn" style="margin-top:12px;" onclick="newTip()">New tip ✨</button>
    </div>
  </div>
</div>

<!-- NOTE MODAL -->
<div class="modal-overlay" id="noteModal">
  <div class="note-modal">
    <h3>📝 My Study Notes</h3>
    <textarea class="note-textarea" id="noteInput" placeholder="Write your thoughts, tasks, or reminders..."></textarea>
    <div class="note-actions">
      <button class="note-close" onclick="closeNotes()">Close</button>
      <button class="note-save"  onclick="saveNote()">Save Note ✨</button>
    </div>
    <div class="saved-notes" id="savedNotes"></div>
  </div>
</div>

<script>
const PLAYLIST_URL = "https://open.spotify.com/playlist/37i9dQZF1DX8Uebhn9wzrS";

const MODES = {
  pomodoro:   { label:"Focus Time",  mins:25 },
  longbreak:  { label:"Long Break",  mins:10 },
  shortbreak: { label:"Short Break", mins:5  },
};

const TIPS = [
  { e:"🌸", t:"Take a deep breath before you start. A calm mind studies better!" },
  { e:"💧", t:"Stay hydrated! Drink a glass of water every session." },
  { e:"📵", t:"Put your phone face-down. Out of sight, out of mind." },
  { e:"🎯", t:"Set one clear goal per Pomodoro. One thing at a time!" },
  { e:"🌿", t:"A tidy desk = a tidy mind. Clear your space first." },
  { e:"🦋", t:"Every expert was once a beginner. Keep going!" },
  { e:"🌙", t:"Short breaks are not wasted time — they recharge your brain." },
  { e:"⭐", t:"Reward yourself after hitting your daily goal. You deserve it!" },
  { e:"🎵", t:"Lofi music can boost focus. Let the beats carry you through." },
  { e:"😸", t:"Mimi is proud of you just for showing up today. Keep it up!" },
];

let currentMode   = "pomodoro";
let totalSecs     = 25 * 60;
let remainSecs    = totalSecs;
let timerRunning  = false;
let timerInterval = null;
let sessionCount  = parseInt(localStorage.getItem("mimi_sessions") || "0");
let dailyGoal     = parseInt(localStorage.getItem("mimi_goal") || "4");
let notes         = JSON.parse(localStorage.getItem("mimi_notes") || "[]");
let tipIdx        = 0;
let isDark        = localStorage.getItem("mimi_theme") === "dark";

/* ── THEME ── */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
  document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
}
function toggleTheme() {
  isDark = !isDark;
  localStorage.setItem("mimi_theme", isDark ? "dark" : "light");
  applyTheme();
}
applyTheme();

/* ── STARS ── */
(function() {
  const c = document.getElementById("starsBg");
  const chars = ["★","✦","·","⋆","*"];
  for (let i = 0; i < 55; i++) {
    const s = document.createElement("span");
    s.className = "star";
    s.textContent = chars[Math.floor(Math.random()*chars.length)];
    s.style.cssText = `left:${Math.random()*97}%;top:${Math.random()*93}%;font-size:${7+Math.random()*9}px;color:${Math.random()>.4?"#e8d87a":"rgba(255,255,255,.4)"};--d:${2+Math.random()*3.5}s;--delay:-${Math.random()*5}s;`;
    c.appendChild(s);
  }
})();

/* ── MODE ── */
function setMode(btn) {
  if (timerRunning) stopTimer();
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentMode = btn.dataset.mode;
  totalSecs = MODES[currentMode].mins * 60;
  remainSecs = totalSecs;
  document.getElementById("sessionLabel").textContent = MODES[currentMode].label;
  updateDisplay();
}

/* ── TIMER ── */
function toggleTimer() { timerRunning ? pauseTimer() : startTimer(); }

function startTimer() {
  if (remainSecs === 0) remainSecs = totalSecs;
  timerRunning = true;
  document.getElementById("startBtn").textContent = "PAUSE";
  document.getElementById("startBtn").classList.add("running");
  document.getElementById("clockIcon").classList.add("running");
  timerInterval = setInterval(tick, 1000);
}
function pauseTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  document.getElementById("startBtn").textContent = "START";
  document.getElementById("startBtn").classList.remove("running");
  document.getElementById("clockIcon").classList.remove("running");
}
function stopTimer() { pauseTimer(); remainSecs = totalSecs; updateDisplay(); }

function tick() {
  remainSecs--;
  updateDisplay();
  if (remainSecs <= 0) {
    remainSecs = 0;
    clearInterval(timerInterval);
    timerInterval = null;
    timerRunning = false;
    onTimerEnd();
  }
}

function onTimerEnd() {
  document.getElementById("startBtn").textContent = "START";
  document.getElementById("startBtn").classList.remove("running");
  document.getElementById("clockIcon").classList.remove("running");
  if (currentMode === "pomodoro") {
    sessionCount++;
    localStorage.setItem("mimi_sessions", sessionCount);
    updateGoalUI();
  }
  const el = document.getElementById("timerDisplay");
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function ringBell(startTime) {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, startTime);
      osc.frequency.exponentialRampToValueAtTime(440, startTime + 0.8);
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.7, startTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.2);
      osc.start(startTime); osc.stop(startTime + 1.2);
    }
    ringBell(ctx.currentTime);
    ringBell(ctx.currentTime + 1.4);
    ringBell(ctx.currentTime + 2.8);
  } catch(e){}
}

function updateDisplay() {
  const m = String(Math.floor(remainSecs/60)).padStart(2,"0");
  const s = String(remainSecs%60).padStart(2,"0");
  document.getElementById("timerDisplay").textContent = `${m}:${s}`;
}

/* ── GOAL ── */
function setGoal(btn) {
  document.querySelectorAll(".goal-btn[data-goal]").forEach(b => b.classList.remove("active-goal"));
  btn.classList.add("active-goal");
  dailyGoal = parseInt(btn.dataset.goal);
  localStorage.setItem("mimi_goal",""+dailyGoal);
  updateGoalUI();
}
function updateGoalUI() {
  document.getElementById("sessionCount").textContent = sessionCount;
  document.getElementById("goalBar").style.width = Math.min(100,(sessionCount/dailyGoal)*100)+"%";
  document.getElementById("goalDone").textContent  = sessionCount+" done";
  document.getElementById("goalTotal").textContent = "/ "+dailyGoal+" goal";
  document.querySelectorAll(".goal-btn[data-goal]").forEach(b => {
    b.classList.toggle("active-goal", parseInt(b.dataset.goal)===dailyGoal);
  });
}

/* ── TIPS ── */
function newTip() {
  tipIdx = (tipIdx + 1) % TIPS.length;
  document.getElementById("tipEmoji").textContent = TIPS[tipIdx].e;
  document.getElementById("tipText").textContent  = TIPS[tipIdx].t;
}

/* ── MUSIC ── */
function openPlaylist() {
  window.open(PLAYLIST_URL,"_blank");
  const songs = ["lofi hip hop radio 🎵","chill beats to study 🎶","rainy day café ☕","night owl lofi 🦉","focus flow 🌙","cozy study vibes 📚"];
  const np = document.getElementById("nowPlaying");
  np.textContent = songs[Math.floor(Math.random()*songs.length)];
  np.classList.remove("idle");
}

/* ── CAT ── */
function catClick() {
  const c = document.getElementById("catWrap");
  c.style.animation = "none"; void c.offsetWidth;
  c.style.animation = "catWiggle .5s ease-in-out 3";
  setTimeout(()=>{ c.style.animation = "catBob 2.6s ease-in-out infinite"; }, 1600);
}

/* ── NOTES ── */
function openNotes()  { document.getElementById("noteModal").classList.add("open"); renderNotes(); }
function closeNotes() { document.getElementById("noteModal").classList.remove("open"); document.getElementById("noteInput").value=""; }
function saveNote() {
  const txt = document.getElementById("noteInput").value.trim();
  if (!txt) return;
  notes.unshift({ text:txt, time:new Date().toLocaleTimeString() });
  localStorage.setItem("mimi_notes", JSON.stringify(notes));
  document.getElementById("noteInput").value = "";
  renderNotes();
}
function deleteNote(i) {
  notes.splice(i,1);
  localStorage.setItem("mimi_notes", JSON.stringify(notes));
  renderNotes();
}
function renderNotes() {
  const c = document.getElementById("savedNotes");
  if (!notes.length) { c.innerHTML=""; return; }
  c.innerHTML = notes.map((n,i)=>`
    <div class="note-item">
      <button class="note-delete" onclick="deleteNote(${i})">✕</button>
      <div style="font-weight:700;font-size:11px;color:#9a72b8;margin-bottom:4px">${n.time}</div>
      <div>${n.text.replace(/</g,"&lt;")}</div>
    </div>`).join("");
}

document.getElementById("noteModal").addEventListener("click",function(e){ if(e.target===this) closeNotes(); });

updateDisplay();
updateGoalUI();
</script>
</body>
</html>
